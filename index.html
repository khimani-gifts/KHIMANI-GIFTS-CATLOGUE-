<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KHIMANI GIFTS - Product Catalog</title>
  <style>
    :root {
      --primary-color: #7C2D2E;
      --primary-hover: #5a2021;
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-color: #333333;
      --text-muted: #666666;
      --border-color: #e0e0e0;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
      --radius: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding-bottom: 80px;
    }

    /* Top Navigation Bar */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: #ffffff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-svg {
      width: 36px;
      height: 36px;
      fill: var(--primary-color);
    }

    .shop-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--primary-color);
      letter-spacing: 0.5px;
    }

    .icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }

    .icon-btn:hover {
      background-color: #f0f0f0;
    }

    /* Announcement Banner */
    .banner {
      background-color: var(--primary-color);
      color: #ffffff;
      text-align: center;
      padding: 8px 12px;
      font-size: 0.85rem;
      font-weight: 500;
    }

    /* Slide-out Menu Drawer */
    .drawer-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 998;
      display: none;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .drawer-overlay.active {
      display: block;
      opacity: 1;
    }

    .drawer {
      position: fixed;
      top: 0;
      left: -280px;
      width: 280px;
      height: 100%;
      background: #ffffff;
      z-index: 999;
      box-shadow: 2px 0 12px rgba(0,0,0,0.15);
      transition: left 0.3s ease;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .drawer.active {
      left: 0;
    }

    .drawer-header {
      background-color: var(--primary-color);
      color: white;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .drawer-title {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .drawer-content {
      padding: 16px;
      flex: 1;
    }

    .menu-item {
      display: block;
      padding: 12px 8px;
      font-size: 1rem;
      color: var(--text-color);
      text-decoration: none;
      border-bottom: 1px solid var(--border-color);
      cursor: pointer;
    }

    .menu-item-dropdown {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .dropdown-arrow {
      transition: transform 0.3s ease;
    }

    .dropdown-arrow.rotated {
      transform: rotate(180deg);
    }

    .submenu {
      display: none;
      background-color: #fdfdfd;
      padding-left: 12px;
    }

    .submenu.active {
      display: block;
    }

    .submenu-item {
      padding: 10px;
      font-size: 0.9rem;
      color: #555;
      border-bottom: 1px dashed var(--border-color);
      cursor: pointer;
    }

    .drawer-footer {
      padding: 16px;
      border-top: 1px solid var(--border-color);
    }

    .owner-btn {
      width: 100%;
      padding: 10px;
      background: #333;
      color: #fff;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      font-weight: 600;
    }

    /* Controls Section: Search & Filters */
    .controls-section {
      padding: 16px;
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .search-bar {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid var(--border-color);
      border-radius: 25px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-bar:focus {
      border-color: var(--primary-color);
    }

    .filters-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }

    .filters-row::-webkit-scrollbar {
      display: none;
    }

    .filter-select, .chip-btn {
      padding: 8px 14px;
      border: 1px solid var(--border-color);
      border-radius: 20px;
      background: #ffffff;
      font-size: 0.85rem;
      white-space: nowrap;
      cursor: pointer;
      outline: none;
    }

    .chip-btn.active {
      background-color: var(--primary-color);
      color: #ffffff;
      border-color: var(--primary-color);
    }

    /* Product Grid */
    .catalog-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 16px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 16px;
    }

    @media (min-width: 600px) {
      .catalog-container {
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      }
    }

    .product-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .product-img-wrapper {
      width: 100%;
      padding-top: 100%;
      position: relative;
      background: #f0f0f0;
    }

    .product-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .product-details {
      padding: 12px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .product-category {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .product-title {
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 8px;
      line-height: 1.3;
    }

    .product-price-row {
      display: flex;
      align-items: baseline;
      gap: 6px;
      margin-top: auto;
      margin-bottom: 10px;
    }

    .price {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--primary-color);
    }

    .mrp {
      font-size: 0.8rem;
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .inquire-btn {
      width: 100%;
      padding: 8px;
      background-color: #25D366;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-decoration: none;
    }

    .inquire-btn:hover {
      background-color: #1eb956;
    }

    /* Modal Styling */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.6);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal.active {
      display: flex;
    }

    .modal-card {
      background: #ffffff;
      border-radius: var(--radius);
      max-width: 500px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 20px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 4px;
      font-weight: 600;
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      outline: none;
    }

    .submit-btn {
      width: 100%;
      padding: 12px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <!-- Top Navigation Bar -->
  <header>
    <div class="brand-container">
      <svg class="logo-svg" viewBox="0 0 100 100">
        <path d="M50 20 C45 35 35 45 20 45 C35 55 45 75 50 85 C55 75 65 55 80 45 C65 45 55 35 50 20 Z" />
        <path d="M50 30 C47 40 40 47 30 47 C40 53 47 67 50 75 C53 67 60 53 70 47 C60 47 53 40 50 30 Z" opacity="0.5"/>
      </svg>
      <span class="shop-title">KHIMANI GIFTS</span>
    </div>
    <button class="icon-btn" onclick="openDrawer()" aria-label="Open Menu">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#7C2D2E" stroke-width="2.5">
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>
  </header>

  <!-- Banner -->
  <div class="banner">✨ Premium Traditional Return Gifts & Festive Novelties</div>

  <!-- Drawer Menu -->
  <div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>
  <div class="drawer" id="menuDrawer">
    <div class="drawer-header">
      <span class="drawer-title">Menu</span>
      <button class="icon-btn" onclick="closeDrawer()" style="color: white;">✕</button>
    </div>
    <div class="drawer-content">
      <div class="menu-item menu-item-dropdown" onclick="toggleCategoryMenu()">
        <span>Categories</span>
        <span class="dropdown-arrow" id="menuArrow">▼</span>
      </div>
      <div class="submenu" id="categorySubmenu">
        <div class="submenu-item" onclick="filterCategory('All')">All Categories</div>
        <div class="submenu-item" onclick="filterCategory('Return Gifts')">Return Gifts</div>
        <div class="submenu-item" onclick="filterCategory('Festive Novelties')">Festive Novelties</div>
        <div class="submenu-item" onclick="filterCategory('Handicrafts')">Handicrafts</div>
        <div class="submenu-item" onclick="filterCategory('Decorative Items')">Decorative Items</div>
      </div>

      <a href="https://wa.me/917305622930" class="menu-item" target="_blank">💬 WhatsApp Support</a>
      <a href="https://instagram.com" class="menu-item" target="_blank">📸 Instagram Page</a>
      <a href="https://maps.google.com" class="menu-item" target="_blank">📍 Store Location</a>
    </div>
    <div class="drawer-footer">
      <button class="owner-btn" onclick="promptOwnerLogin()">Owner Panel</button>
    </div>
  </div>

  <!-- Search & Filter Controls -->
  <div class="controls-section">
    <input type="text" id="searchInput" class="search-bar" placeholder="Search products..." oninput="applyFilters()">
    
    <div class="filters-row">
      <select id="sortSelect" class="filter-select" onchange="applyFilters()">
        <option value="default">Sort by: Default</option>
        <option value="low-high">Price: Low to High</option>
        <option value="high-low">Price: High to Low</option>
      </select>

      <button class="chip-btn active" onclick="setMaterialFilter('All', this)">All Materials</button>
      <button class="chip-btn" onclick="setMaterialFilter('Plastic', this)">Plastic Items</button>
      <button class="chip-btn" onclick="setMaterialFilter('Metal', this)">Metal Items</button>
      <button class="chip-btn" onclick="setMaterialFilter('Diya', this)">Metal Diyas</button>
      <button class="chip-btn" onclick="setMaterialFilter('Idol', this)">Metal Idols</button>
      <button class="chip-btn" onclick="setMaterialFilter('KeyHolder', this)">Key Holders</button>
    </div>
  </div>

  <!-- Catalog Grid -->
  <div class="catalog-container" id="catalogGrid"></div>

  <!-- Owner Admin Modal -->
  <div class="modal" id="ownerModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Add New Product</h3>
        <button class="icon-btn" onclick="closeModal()">✕</button>
      </div>
      <form id="addProductForm" onsubmit="handleProductAdd(event)">
        <div class="form-group">
          <label>Product Title</label>
          <input type="text" id="prodTitle" required>
        </div>
        <div class="form-group">
          <label>Category</label>
          <select id="prodCategory">
            <option value="Return Gifts">Return Gifts</option>
            <option value="Festive Novelties">Festive Novelties</option>
            <option value="Handicrafts">Handicrafts</option>
            <option value="Decorative Items">Decorative Items</option>
          </select>
        </div>
        <div class="form-group">
          <label>Material Type / Tag</label>
          <select id="prodMaterial">
            <option value="Plastic">Plastic Items</option>
            <option value="Metal">Metal Items</option>
            <option value="Diya">Metal Diyas</option>
            <option value="Idol">Metal Idols</option>
            <option value="KeyHolder">Key Holders</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div class="form-group">
          <label>Selling Price (₹)</label>
          <input type="number" id="prodPrice" required>
        </div>
        <div class="form-group">
          <label>MRP (₹)</label>
          <input type="number" id="prodMrp">
        </div>
        <div class="form-group">
          <label>Product Photo (Select from Gallery)</label>
          <input type="file" id="prodImage" accept="image/*" onchange="convertImageToBase64(this)" required>
        </div>
        <button type="submit" class="submit-btn">Save Product</button>
      </form>
    </div>
  </div>

  <script>
    // Initial Products Data
    const initialProducts = [
      { id: 1, title: "Decorative Metal Diya", category: "Festive Novelties", material: "Diya", price: 150, mrp: 250, image: "https://via.placeholder.com/200?text=Metal+Diya" },
      { id: 2, title: "Ganesha Metal Idol", category: "Handicrafts", material: "Idol", price: 350, mrp: 500, image: "https://via.placeholder.com/200?text=Metal+Ganesha" },
      { id: 3, title: "Wooden Key Holder", category: "Decorative Items", material: "KeyHolder", price: 200, mrp: 300, image: "https://via.placeholder.com/200?text=Key+Holder" },
      { id: 4, title: "Plastic Return Gift Container", category: "Return Gifts", material: "Plastic", price: 45, mrp: 80, image: "https://via.placeholder.com/200?text=Gift+Box" }
    ];

    let products = JSON.parse(localStorage.getItem('khimani_products')) || initialProducts;
    let currentCategory = 'All';
    let currentMaterial = 'All';
    let uploadedImageBase64 = '';

    // Render Products
    function renderProducts(items) {
      const grid = document.getElementById('catalogGrid');
      grid.innerHTML = '';

      if (items.length === 0) {
        grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px 0;">No products found matching your search.</p>';
        return;
      }

      items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'product-card';
        const waMsg = encodeURIComponent(`Hello KHIMANI GIFTS, I would like to inquire about: ${item.title} (Price: ₹${item.price})`);
        
        card.innerHTML = `
          <div class="product-img-wrapper">
            <img class="product-img" src="${item.image}" alt="${item.title}">
          </div>
          <div class="product-details">
            <span class="product-category">${item.category}</span>
            <div class="product-title">${item.title}</div>
            <div class="product-price-row">
              <span class="price">₹${item.price}</span>
              ${item.mrp ? `<span class="mrp">₹${item.mrp}</span>` : ''}
            </div>
            <a href="https://wa.me/917305622930?text=${waMsg}" class="inquire-btn" target="_blank">
              💬 Inquire on WhatsApp
            </a>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // Navigation & Drawer Logic
    function openDrawer() {
      document.getElementById('menuDrawer').classList.add('active');
      document.getElementById('drawerOverlay').classList.add('active');
    }

    function closeDrawer() {
      document.getElementById('menuDrawer').classList.remove('active');
      document.getElementById('drawerOverlay').classList.remove('active');
    }

    function toggleCategoryMenu() {
      const submenu = document.getElementById('categorySubmenu');
      const arrow = document.getElementById('menuArrow');
      submenu.classList.toggle('active');
      arrow.classList.toggle('rotated');
    }

    // Filtering & Sorting
    function filterCategory(cat) {
      currentCategory = cat;
      closeDrawer();
      applyFilters();
    }

    function setMaterialFilter(mat, btn) {
      currentMaterial = mat;
      document.querySelectorAll('.chip-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      applyFilters();
    }

    function applyFilters() {
      const searchQuery = document.getElementById('searchInput').value.toLowerCase();
      const sortValue = document.getElementById('sortSelect').value;

      let filtered = products.filter(p => {
        const matchesCategory = currentCategory === 'All' || p.category === currentCategory;
        const matchesMaterial = currentMaterial === 'All' || p.material === currentMaterial;
        const matchesSearch = p.title.toLowerCase().includes(searchQuery);
        return matchesCategory && matchesMaterial && matchesSearch;
      });

      if (sortValue === 'low-high') {
        filtered.sort((a, b) => a.price - b.price);
      } else if (sortValue === 'high-low') {
        filtered.sort((a, b) => b.price - a.price);
      }

      renderProducts(filtered);
    }

    // Owner Functions
    function promptOwnerLogin() {
      const pin = prompt("Enter Owner Security PIN:");
      if (pin === "1234") {
        closeDrawer();
        document.getElementById('ownerModal').classList.add('active');
      } else if (pin !== null) {
        alert("Incorrect PIN!");
      }
    }

    function closeModal() {
      document.getElementById('ownerModal').classList.remove('active');
    }

    function convertImageToBase64(input) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          uploadedImageBase64 = e.target.result;
        };
        reader.readAsDataURL(input.files[0]);
      }
    }

    function handleProductAdd(e) {
      e.preventDefault();
      const newProduct = {
        id: Date.now(),
        title: document.getElementById('prodTitle').value,
        category: document.getElementById('prodCategory').value,
        material: document.getElementById('prodMaterial').value,
        price: Number(document.getElementById('prodPrice').value),
        mrp: Number(document.getElementById('prodMrp').value) || null,
        image: uploadedImageBase64 || 'https://via.placeholder.com/200?text=No+Photo'
      };

      products.unshift(newProduct);
      localStorage.setItem('khimani_products', JSON.stringify(products));
      applyFilters();
      closeModal();
      document.getElementById('addProductForm').reset();
      alert('Product saved successfully!');
    }

    // Initial Load
    applyFilters();
  </script>
</body>
</html>
